# Security headers for every production response — SPA shell, hashed
# assets, /api and /sanctum alike.
#
# Included at server level AND in every location that has its own
# add_header: nginx only inherits add_header from the enclosing level
# when a location defines none of its own, so a lone Cache-Control in
# /assets/ would otherwise silently drop all of these.
#
# CSP exceptions beyond 'self' (rationale in docs/DEVELOPMENT.md):
#   style-src  https://fonts.googleapis.com  — the Google Fonts stylesheet
#                                              linked from index.html
#   font-src   https://fonts.gstatic.com     — the font files it references
# React's style={{…}} props go through the CSSOM, which CSP does not
# govern, so no 'unsafe-inline' is needed.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), usb=(), xr-spatial-tracking=()" always;

# HSTS belongs only behind TLS: sent over plain HTTP it is ignored, and
# once a browser has seen it over HTTPS the domain is locked to HTTPS for
# max-age. Uncomment when this nginx (or the proxy in front of it)
# terminates TLS for a real domain.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
